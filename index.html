<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff7a59">
<title>주원이의 일본 TRIP</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="주원 TRIP">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+JP:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff6ec;--card:#fff;--ink:#2b2b3a;--mute:#8b8798;--pri:#ff7a59;--pri-d:#dd5a3c;--blue:#3d8bfd;--green:#21b36b;--gold:#ffb703;--red:#ef476f;--line:#f1e2d3;--soft:#fff0e3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Jua','Noto Sans JP',sans-serif;font-size:17px}
button{font-family:inherit;color:inherit;cursor:pointer}
input,textarea{font-family:inherit;font-size:17px}
.wrap{max-width:520px;margin:0 auto;padding:14px 14px 96px}
.jp{font-family:'Noto Sans JP',sans-serif;font-weight:700}
.mute{color:var(--mute)}
.small{font-size:14px}
.loading{text-align:center;padding:40vh 0;font-size:22px}
.hero{background:linear-gradient(135deg,#ff7a59,#ffb36b);color:#fff;border-radius:22px;padding:18px 18px 14px;box-shadow:0 5px 0 #f0b48f;margin-bottom:14px}
.hero h1{margin:0;font-size:28px;line-height:1.2}
.hero p{margin:4px 0 12px;opacity:.95}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:#ffffff33;border-radius:999px;padding:5px 11px;font-size:14px}
.chip.dark{background:var(--soft);color:var(--ink)}
.sec-title{font-size:19px;margin:16px 4px 8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--card);border-radius:18px;padding:14px;box-shadow:0 4px 0 var(--line);margin-bottom:12px}
.city{background:var(--card);border:0;border-radius:18px;padding:14px 12px;text-align:left;box-shadow:0 4px 0 var(--line)}
.city .em{font-size:34px}
.city b{display:block;font-size:20px;margin-top:2px}
.city small{display:block;color:var(--mute);font-size:13px;line-height:1.3;margin-top:2px}
.city .pg{margin-top:8px;font-size:13px;color:var(--pri-d)}
.city:active,.btn:active,.opt:active,.tile:active,.coin:active,.city:active{transform:translateY(3px);box-shadow:none}
.btn{display:inline-block;background:var(--pri);color:#fff;border:0;border-radius:14px;padding:12px 18px;font-size:17px;box-shadow:0 4px 0 var(--pri-d)}
.btn.blue{background:var(--blue);box-shadow:0 4px 0 #2a63c0}
.btn.green{background:var(--green);box-shadow:0 4px 0 #168250}
.btn.sec{background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--line);border:1px solid var(--line)}
.btn.wide{display:block;width:100%;margin-top:10px}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.spacer{flex:1}
.top{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.ib{background:#fff;border:1px solid var(--line);border-radius:12px;min-width:40px;height:40px;font-size:17px;padding:0 10px}
.bar{flex:1;height:12px;background:#f3e3d4;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ff9a6b,var(--pri));border-radius:99px;transition:width .3s}
.place{background:#fff;border-radius:18px;padding:14px;box-shadow:0 4px 0 var(--line);margin-bottom:12px}
.place h3{margin:0;font-size:20px}
.place .meta{color:var(--mute);font-size:14px;margin:2px 0 8px}
.scene{display:flex;align-items:center;gap:10px;width:100%;background:var(--soft);border:0;border-radius:14px;padding:11px 12px;margin-top:8px;text-align:left;font-size:16px}
.scene .st{margin-left:auto;color:var(--gold);letter-spacing:1px;white-space:nowrap}
.scene.lock{opacity:.5}
.link{color:var(--blue);text-decoration:none;font-size:14px}
.log{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.bubble{max-width:88%;border-radius:18px;padding:10px 13px;box-shadow:0 3px 0 var(--line)}
.bubble.npc{background:#fff;border-bottom-left-radius:5px}
.bubble.me{background:#d9efff;margin-left:auto;border-bottom-right-radius:5px;box-shadow:0 3px 0 #b9dcf5}
.bubble.react{background:#fff3f5}
.bubble .who{font-size:13px;color:var(--mute);margin-bottom:3px}
.bubble .ja{font-size:20px;line-height:1.5}
.bubble .ko{font-size:14px;color:var(--mute);margin-top:3px}
.bubble .tools{display:flex;gap:6px;margin-top:6px}
.mini{background:var(--soft);border:0;border-radius:10px;padding:5px 10px;font-size:14px}
.ctrl{background:#fff;border-radius:18px;padding:14px;box-shadow:0 4px 0 var(--line)}
.prompt{font-size:16px;color:var(--pri-d);margin-bottom:8px}
.say{font-size:22px;margin:4px 0 10px}
.opt{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:11px 12px;font-size:18px;margin:8px 0;box-shadow:0 3px 0 var(--line)}
.opt .t{flex:1}
.opt.ok{border-color:var(--green);background:#e7fbf0}
.opt.bad{border-color:var(--red);background:#ffeef2}
.slot{min-height:58px;background:#fff8f1;border:2px dashed #f0c4a2;border-radius:14px;padding:5px;margin-bottom:10px}
.tile{display:inline-block;background:#fff;border:2px solid #f0d6c0;border-bottom-width:5px;border-radius:11px;padding:7px 12px;margin:4px;font-size:19px}
.tile.used{visibility:hidden}
.answer{background:#e7fbf0;border-radius:12px;padding:8px 10px;margin:6px 0 10px;font-size:15px}
.menu{background:#3a2b22;color:#fff7ea;border-radius:16px;padding:12px}
.menu h4{margin:0 0 8px;text-align:center;letter-spacing:2px}
.mi{display:flex;justify-content:space-between;width:100%;background:transparent;border:2px solid #ffffff22;color:#fff7ea;border-radius:12px;padding:10px 12px;margin:6px 0;font-size:18px}
.mi.on{background:#ffb70333;border-color:var(--gold)}
.coins{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.coin{width:64px;height:64px;border-radius:50%;border:0;font-size:15px;box-shadow:0 4px 0 #0002;display:flex;align-items:center;justify-content:center}
.coin.c1000{width:96px;border-radius:10px;background:#bfe3d0}
.coin.c500{background:#f3d27a}.coin.c100,.coin.c50{background:#dadde3}.coin.c10{background:#d99a6c}.coin.c5{background:#f0cf6a}.coin.c1{background:#eef0f3;width:54px;height:54px}
.tray{text-align:center;font-size:26px;margin:6px 0}
.big-stars{font-size:46px;color:var(--gold);text-align:center;letter-spacing:4px}
.center{text-align:center}
.reward{display:flex;align-items:center;gap:10px;background:var(--soft);border-radius:12px;padding:9px 12px;margin:6px 0}
.reward .e{font-size:28px}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
.nav button{flex:1;max-width:104px;background:none;border:0;padding:8px 0 9px;font-size:12px;color:var(--mute)}
.nav button b{display:block;font-size:22px;font-weight:normal}
.nav button.on{color:var(--pri-d)}
.stamp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stamp{background:var(--soft);border-radius:14px;padding:8px 4px;text-align:center;font-size:12px}
.stamp .e{font-size:30px;display:block}
.stamp.off .e{filter:grayscale(1);opacity:.3}
.item-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.item{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 2px;text-align:center;font-size:12px}
.item .e{font-size:28px;display:block}
.money-big{font-size:34px;color:var(--pri-d)}
.lg{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.lg:last-child{border-bottom:0}
.warn{background:#fff3cd;border-radius:10px;padding:8px 10px;font-size:13px;margin:4px 0}
.pin{letter-spacing:10px;text-align:center;font-size:26px;width:180px;padding:8px;border:2px solid var(--line);border-radius:12px}
textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:12px;padding:8px;font-size:12px}
.face{font-size:26px}
.install{background:#fff;border:2px dashed var(--pri);border-radius:16px;padding:12px 14px;margin-bottom:12px;font-size:16px;display:flex;flex-direction:column;gap:8px}
</style>
</head>
<body>
<div id="app"><div class="loading">✈️ 불러오는 중…</div></div>
<script src="data.js"></script>
<script>
'use strict';
/* ========== 기본 도구 ========== */
const app=document.getElementById('app');
const PK='kotoba-trip-v1', CK='kotoba-trip-sheet-cache';
function h(tag,attrs,...kids){const e=document.createElement(tag);attrs=attrs||{};for(const k in attrs){const v=attrs[k];if(v==null||v===false)continue;if(k==='class')e.className=v;else if(k==='style')e.style.cssText=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v===true?'':v)}for(const c of kids.flat(3)){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(String(c)))}return e}
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const sample=(a,n)=>shuffle(a).slice(0,n);
const splitP=s=>String(s||'').split('|').map(x=>x.trim()).filter(Boolean);
const num=v=>{const n=parseFloat(String(v??'').replace(/[^0-9.\-]/g,''));return isNaN(n)?0:n};
const on=v=>String(v??'Y').trim().toUpperCase()!=='N';
const won=n=>Number(n||0).toLocaleString('ko-KR')+'원';
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ds(new Date());
function weekKey(s){const d=s?new Date(s+'T00:00:00'):new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return ds(d)}
const monthKey=s=>(s||today()).slice(0,7);
const monthLabel=m=>m.slice(0,4)+'년 '+Number(m.slice(5,7))+'월';
let toastT=null;
function toast(m,ms){let el=document.getElementById('toast');if(!el){el=document.createElement('div');el.id='toast';el.style.cssText='position:fixed;left:50%;bottom:86px;transform:translateX(-50%);max-width:90%;background:#000c;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:9;text-align:center';document.body.append(el)}el.textContent=m;el.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>{el.style.display='none'},ms||3000)}
function show(node,nav){app.replaceChildren(node);if(nav)app.append(navBar(nav));window.scrollTo(0,0)}

/* ========== 설치 (홈 화면 아이콘) ========== */
const UA=navigator.userAgent||'';
const isIOS=/iPhone|iPad|iPod/i.test(UA)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const isAndroid=/Android/i.test(UA);
const isStandalone=()=>(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
if(/KAKAOTALK/i.test(UA)){const u=location.href;if(isIOS)location.href='kakaotalk://web/openExternal?url='+encodeURIComponent(u);else if(isAndroid)location.href='intent://'+u.replace(/^https?:\/\//,'')+'#Intent;scheme=https;package=com.android.chrome;end'}
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;if(D&&document.querySelector('.hero'))homeView()});
window.addEventListener('appinstalled',()=>{deferredPrompt=null;toast('설치 완료! 이제 홈 화면의 주원 TRIP 아이콘으로 열어요',5000);if(D&&document.querySelector('.hero'))homeView()});
if('serviceWorker' in navigator)window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});
function installBar(){let hid=false;try{hid=sessionStorage.getItem('hideInstall')==='1'}catch(e){}if(isStandalone()||hid)return null;
 const close=h('button',{class:'mini',onclick:()=>{try{sessionStorage.setItem('hideInstall','1')}catch(e){}homeView()}},'닫기');
 if(deferredPrompt)return h('div',{class:'install'},h('div',{},'📲 앱으로 설치하면 아이콘만 눌러서 바로 열려요'),h('div',{class:'row'},h('button',{class:'btn green',onclick:async()=>{const p=deferredPrompt;deferredPrompt=null;p.prompt();try{await p.userChoice}catch(e){}homeView()}},'설치하기'),h('span',{class:'spacer'}),close));
 if(isIOS)return h('div',{class:'install'},h('div',{},'📲 홈 화면에 아이콘 만들기 (처음 한 번만)'),h('div',{},'사파리 아래쪽 공유 버튼 ',h('b',{},'⬆️'),' → ',h('b',{},'홈 화면에 추가'),' → ',h('b',{},'추가')),h('div',{class:'small mute'},'공유 버튼이 안 보이면 오른쪽 아래 … → 공유. 다음부터는 아이콘만 누르면 돼요.'),h('div',{class:'row end'},close));
 if(isAndroid)return h('div',{class:'install'},h('div',{},'📲 크롬 오른쪽 위 ⋮ → "앱 설치" (또는 "홈 화면에 추가")'),h('div',{class:'row end'},close));
 return null}

/* ========== 소리 (브라우저 음성합성) ========== */
let JV=null;
function pickVoice(){try{JV=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.toLowerCase().replace('_','-').startsWith('ja'))||null}catch(e){}return JV}
try{speechSynthesis.onvoiceschanged=pickVoice;pickVoice()}catch(e){}
const TTSERR={'language-unavailable':'일본어 음성이 없어요. 폰 설정의 TTS에서 일본어를 설치해 주세요','not-allowed':'브라우저가 소리를 막았어요. 🔊 버튼을 직접 눌러 보세요','synthesis-failed':'음성 엔진 오류예요. Google 음성 서비스를 업데이트해 주세요','synthesis-unavailable':'음성 엔진이 없어요','network':'일본어 음성에 인터넷 연결이 필요해요','audio-busy':'다른 앱이 소리를 쓰는 중이에요'};
function speak(t,rate){return new Promise(res=>{
 let done=false;const fin=()=>{if(!done){done=true;res()}};
 if(typeof speechSynthesis==='undefined'||typeof SpeechSynthesisUtterance==='undefined'){toast('이 브라우저는 음성 재생을 지원하지 않아요');return fin()}
 const go=useV=>{try{const u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.rate=rate||baseRate();const v=useV?(JV||pickVoice()):null;if(v)u.voice=v;
  u.onend=fin;u.onerror=e=>{const c=e.error||'unknown';if(c==='interrupted'||c==='canceled')return fin();if(useV&&v)return go(false);toast((TTSERR[c]||'소리 재생에 실패했어요')+' ('+c+')',6000);fin()};
  if(speechSynthesis.speaking||speechSynthesis.pending)speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){toast('소리 재생에 실패했어요');fin()}};
 go(true);setTimeout(fin,Math.min(9000,1500+String(t).length*200));
})}
const baseRate=()=>{const r=D?num(D.S['말속도']):0;return r>0.3&&r<2?r:0.85};

/* ========== 저장 (기기 브라우저) ========== */
const blankP=()=>({scenes:{},items:{},days:{},ledger:[],weekBonus:{},flags:{newm:{},star3:{},boss:{},pack:{}},words:{},payouts:[],pin:null,koShow:null});
function loadP(){try{const p=Object.assign(blankP(),JSON.parse(localStorage.getItem(PK)||'{}'));p.flags=Object.assign(blankP().flags,p.flags||{});return p}catch(e){return blankP()}}
let P=loadP();
function saveP(){try{localStorage.setItem(PK,JSON.stringify(P))}catch(e){toast('저장 공간이 부족해요')}}

/* ========== 데이터 (구글 시트 → 기기 저장본 → 기본값) ========== */
let D=null;
function parseCSV(t){t=String(t).replace(/^\uFEFF/,'');const rows=[];let row=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else{if(c==='"')q=true;else if(c===','){row.push(f);f=''}else if(c==='\n'){row.push(f);rows.push(row);row=[];f=''}else if(c!=='\r')f+=c}}if(f!==''||row.length){row.push(f);rows.push(row)}return rows}
function rowsToObj(rows){if(!rows||!rows.length)return[];const hd=rows[0].map(x=>String(x??'').trim());return rows.slice(1).filter(r=>r.some(c=>String(c??'').trim()!=='')).map(r=>{const o={};hd.forEach((k,i)=>{if(k)o[k]=String(r[i]??'').trim()});return o})}
async function fetchT(url,ms){const ac=new AbortController();const t=setTimeout(()=>ac.abort(),ms);try{return await fetch(url,{signal:ac.signal,cache:'no-store'})}finally{clearTimeout(t)}}
async function loadData(){
 const warn=[];let raw=null,src='기본 내장 데이터';const cfg=window.SHEET_CONFIG||{};const DEF=window.DEFAULT_DATA||{};
 if(cfg.pub&&cfg.gids&&Object.keys(cfg.gids).length){
  try{const tabs=Object.keys(cfg.gids);
   const get=t=>fetchT(cfg.pub+'?gid='+cfg.gids[t]+'&single=true&output=csv&_='+Date.now(),8000).then(r=>{if(!r.ok)throw new Error(t+' 탭 '+r.status);return r.text()});
   const texts=[];for(let i=0;i<tabs.length;i+=3){const part=await Promise.all(tabs.slice(i,i+3).map(get));texts.push(...part)}
   raw={};tabs.forEach((t,i)=>{const rows=parseCSV(texts[i]);if(/^\s*<!DOCTYPE|<html/i.test(texts[i]))throw new Error(t+' 탭이 웹에 게시되지 않았어요');raw[t]=rows});
   src='구글 시트';try{localStorage.setItem(CK,JSON.stringify({at:Date.now(),raw}))}catch(e){}
  }catch(e){warn.push('시트를 못 불러왔어요: '+(e.name==='AbortError'?'시간 초과':e.message));raw=null;
   try{const c=JSON.parse(localStorage.getItem(CK)||'null');if(c&&c.raw){raw=c.raw;src='기기 저장본 ('+new Date(c.at).toLocaleString('ko-KR')+')'}}catch(e2){}}
 }
 raw=raw||{};for(const k in DEF){if(!raw[k]||raw[k].length<1){raw[k]=DEF[k];if(src==='구글 시트')warn.push(k+' 탭이 비어 있어서 기본값을 썼어요')}}
 return build(raw,src,warn);
}
const NPC_T=['말','전화'],ME_T=['고르기','타일','빈칸','말하기','메뉴','돈내기'];
const byOrder=(a,b)=>num(a['순서'])-num(b['순서']);
function build(raw,src,warn){
 const T=k=>rowsToObj(raw[k]);
 const S={};T('설정').forEach(r=>{if(r['키'])S[r['키']]=r['값']||''});
 const cities=T('도시').filter(r=>r['도시ID']&&on(r['사용'])).sort(byOrder);
 const places=T('장소').filter(r=>r['장소ID']&&on(r['사용'])).sort(byOrder);
 const scenes=T('장면').filter(r=>r['장면ID']&&on(r['사용'])).sort(byOrder);
 const lines={};T('대화').forEach(r=>{const id=r['장면ID'];if(id)(lines[id]=lines[id]||[]).push(r)});
 const words={};T('단어').forEach(r=>{if(r['장면ID']&&r['일본어'])(words[r['장면ID']]=words[r['장면ID']]||[]).push(r)});
 const chars={};T('캐릭터').forEach(r=>{if(r['캐릭터ID'])chars[r['캐릭터ID']]=r});
 const items=T('아이템').filter(r=>r['아이템ID']&&r['장면ID']);

 const cIds=new Set(cities.map(c=>c['도시ID'])),pIds=new Set(places.map(p=>p['장소ID'])),sIds=new Set(scenes.map(s=>s['장면ID']));

function testPool(){const ids=Object.keys(P.scenes).filter(id=>D.lines[id]);const src=ids.length?ids:D.scenes.map(s=>s['장면ID']);const out=[];
 src.forEach(id=>{const s=sceneById(id);if(!s)return;const p=placeById(s['장소ID']);(D.lines[id]||[]).forEach(r=>{if(r['누가']!=='나')return;let ja='';const ty=r['형태'];
  if(ty==='고르기')ja=r['정답'];else if(ty==='타일'||ty==='말하기')ja=r['일본어'];else if(ty==='빈칸')ja=String(r['일본어']).replace(/\[(.+?)\]/,'$1');if(ja)out.push({ja:fill(ja,p,'ja'),ko:fill(r['한국어'],p,'ko')})})});return out}
let TS=null;
function testStart(m){const n=Math.max(1,num(D.S['확인시험문장수'])||3);TS={m,qs:sample(testPool(),n),i:0,pass:0,open:false};testQ()}
function testQ(){if(TS.i>=TS.qs.length)return testEnd();const q=TS.qs[TS.i];
 const mark=ok=>{if(ok)TS.pass++;TS.i++;TS.open=false;testQ()};
 show(h('div',{class:'wrap'},h('div',{class:'top'},h('button',{class:'ib',onclick:dadView},'←'),h('b',{},'아빠 확인 시험 '+(TS.i+1)+'/'+TS.qs.length)),
  h('div',{class:'card center'},h('div',{class:'small mute'},'아빠가 한국어로 읽어 주면, 주원이가 일본어로 말해요'),h('div',{style:'font-size:26px;margin:14px 0'},q.ko),
   TS.open?h('div',{},h('div',{class:'jp',style:'font-size:22px;margin:8px 0;color:var(--green)'},q.ja),h('button',{class:'mini',onclick:()=>speak(q.ja)},'🔊 발음 듣기')):h('button',{class:'btn sec',onclick:()=>{TS.open=true;testQ()}},'👀 정답 보기')),
  h('div',{class:'row'},h('button',{class:'btn green',style:'flex:1',onclick:()=>mark(true)},'⭕ 맞았어요'),h('button',{class:'btn sec',style:'flex:1',onclick:()=>mark(false)},'❌ 아쉬워요'))
 ))}
function testEnd(){const m=TS.m,amt=monthSum(m);
 show(h('div',{class:'wrap'},h('div',{class:'card center'},h('div',{style:'font-size:44px'},TS.pass===TS.qs.length?'🎉':'💪'),h('div',{style:'font-size:22px'},TS.qs.length+'문제 중 '+TS.pass+'개 통과'),
  h('div',{class:'small mute',style:'margin:6px 0 10px'},monthLabel(m)+' 적립금 '+won(amt)),
  h('button',{class:'btn green wide',onclick:()=>{if(!confirm(monthLabel(m)+' 용돈 '+won(amt)+'을 지급 완료로 처리할까요?'))return;const d=today();P.ledger.forEach(e=>{if(e.m===m&&!e.paid)e.paid=d});P.payouts.push({m,amt,d,test:TS.pass+'/'+TS.qs.length});saveP();toast('지급 완료로 기록했어요');dadView()}},'💸 지급 완료로 처리'),
  h('button',{class:'btn sec wide',onclick:()=>testStart(m)},'🔁 시험 다시 보기'),h('button',{class:'btn sec wide',onclick:dadView},'다음에 하기'))),'dad')}

/* ========== 시작 ========== */
(async()=>{try{D=await loadData();homeView()}catch(e){app.replaceChildren(h('div',{class:'wrap'},h('div',{class:'card'},'앱을 여는 중 문제가 생겼어요: '+e.message)))}})();
</script>
